      tags: [Media]
      summary: Upload an image
      description: |
        ⚠️ Takes a **base64 data URI as JSON**, NOT a multipart upload.
        Multipart returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'

  /api/v1/audio/upload:
    post:
      tags: [Media]
      summary: Initiate an audio/podcast upload (returns S3 presigned URL)
      description: |
        First step of a 4-step S3 presigned multipart upload:
        1. POST here → returns `media_upload_id` (UUID) and S3 presigned PUT URL
           to `https://substack-video.s3-accelerate.amazonaws.com/video_upload/post/{post_id}/{upload_id}/original`.
           (Yes, `substack-video` — unified media bucket.)
        2. PUT raw bytes to that S3 URL. Save the ETag header.
        3. POST to `/audio/upload/{upload_id}/transcode` with multipart info.
        4. Poll `GET /audio/upload/{upload_id}` for status.

        ⚠️ Substack rejects very-short audio (~<1s real content) with a
        generic upload error after transcode.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadInit'

  /api/v1/audio/upload/{upload_id}:
    get:
      tags: [Media]
      summary: Poll upload + transcode status
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }

  /api/v1/audio/upload/{upload_id}/transcode:
    post:
      tags: [Media]
      summary: Complete multipart upload and start transcode
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioTranscodeRequest'
      responses:
        '200': { description: OK }

